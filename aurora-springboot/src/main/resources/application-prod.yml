server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 禁止 allowMultiQueries，降低拼接 SQL 注入面
    url: jdbc:mysql://127.0.0.1:3306/aurora?serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:127.0.0.1}
    hikari:
      minimum-idle: 10
      idle-timeout: 300000
      maximum-pool-size: 100
      auto-commit: true
      pool-name: MyHikariCP
      max-lifetime: 600000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 1
    timeout: 30000
    lettuce:
      pool:
        min-idle: 5
        max-idle: 20
        max-active: 50
        max-wait: 30000
      shutdown-timeout: 5000ms
      cluster:
        refresh:
          adaptive: true
    # 连接超时配置（30秒）
    connect-timeout: 30000
    # 命令超时配置（30秒）
    command-timeout: 30000

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000

  elasticsearch:
    rest:
      uris: ${ES_URIS:es的ip:9200}

  mail:
    host: smtp.163.com
    username: 
    password:
    default-encoding: UTF-8
    protocol: smtp
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          ssl:
            enable: true
          starttls:
            enable: true
            required: true
  servlet:
    multipart:

      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 生产关闭 SQL 全量打印，StdOutImpl 会把 article_content 等大字段刷进 stdout
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.aurora.mapper: info
    com.aurora: info
    org.springframework.amqp: warn
    org.springframework.security: warn
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx'

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 设置足够强度的密钥（建议 32 字节以上的随机 Base64 字符串），
  # 否则将使用下方默认值；默认值仅用于本地开发，任何知道它的人都能伪造 token
  secret: ${JWT_SECRET:aurora-default-secret-change-me-2026}

# 生产环境前面有 Nginx 等反向代理：IpUtil 仅在 remoteAddr 为内网地址时信任代理头中的 IP，
# Nginx 需配置 proxy_set_header X-Real-IP $remote_addr; 转发真实客户端 IP

qq:
  app-id: 102884037
  check-token-url: https://graph.qq.com/oauth2.0/me?access_token={access_token}
  user-info-url: https://graph.qq.com/user/get_user_info?openid={openid}&access_token={access_token}&oauth_consumer_key={oauth_consumer_key}
